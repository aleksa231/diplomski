server:
  port: 8083

spring:
  application:
    name: relational
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/benchmark}
    username: ${SPRING_DATASOURCE_USERNAME:benchmark}
    password: ${SPRING_DATASOURCE_PASSWORD:benchmark}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  cache:
    enabled: ${APP_CACHE_ENABLED:false}
    ttl-seconds: ${APP_CACHE_TTL_SECONDS:300}
  cart:
    ttl-seconds: ${APP_CART_TTL_SECONDS:1800}
    cleanup-interval-ms: ${APP_CART_CLEANUP_INTERVAL_MS:60000}
  relational:
    variant: ${APP_RELATIONAL_VARIANT:normalized}
  indexes:
    enabled: ${APP_INDEXES_ENABLED:true}
  stub-service:
    url: ${STUB_SERVICE_URL:http://localhost:8099}

server {
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to nosql-blocking (8081)
    location /api/blocking/ {
        proxy_pass http://nosql-blocking:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy to nosql-reactive (8082)
    location /api/reactive/ {
        proxy_pass http://nosql-reactive:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy to relational (8083)
    location /api/relational/ {
        proxy_pass http://relational:8083/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy to experiment-runner (8090)
    location /api/runner/ {
        proxy_pass http://experiment-runner:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    location /api/live {
        proxy_pass http://experiment-runner:8090/api/live;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/experiments {
        proxy_pass http://experiment-runner:8090/api/experiments;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

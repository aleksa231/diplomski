server {
    listen 3000;
    server_name localhost;

    # Docker's embedded DNS. Without it nginx resolves the upstream names only once, at startup, and
    # keeps the stale IP after `docker compose up --build <service>` recreates a container: every
    # proxied call then fails with 502 until the frontend container is restarted as well.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to nosql-blocking (8081)
    location /api/blocking/ {
        set $nosql_blocking http://nosql-blocking:8081;
        rewrite ^/api/blocking/(.*)$ /api/$1 break;
        proxy_pass $nosql_blocking;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy to nosql-reactive (8082)
    location /api/reactive/ {
        set $nosql_reactive http://nosql-reactive:8082;
        rewrite ^/api/reactive/(.*)$ /api/$1 break;
        proxy_pass $nosql_reactive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy to relational (8083)
    location /api/relational/ {
        set $relational http://relational:8083;
        rewrite ^/api/relational/(.*)$ /api/$1 break;
        proxy_pass $relational;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy to experiment-runner (8090)
    location /api/runner/ {
        set $runner http://experiment-runner:8090;
        rewrite ^/api/runner/(.*)$ /api/$1 break;
        proxy_pass $runner;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    location /api/live {
        set $runner http://experiment-runner:8090;
        proxy_pass $runner;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/experiments {
        set $runner http://experiment-runner:8090;
        proxy_pass $runner;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

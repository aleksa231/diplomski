global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'spring-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['nosql-blocking:8081']
        labels:
          application: 'nosql-blocking'
      - targets: ['nosql-reactive:8082']
        labels:
          application: 'nosql-reactive'
      - targets: ['relational:8083']
        labels:
          application: 'relational'
      - targets: ['stub-service:8099']
        labels:
          application: 'stub-service'
      - targets: ['experiment-runner:8090']
        labels:
          application: 'experiment-runner'

  - job_name: 'mongodb-exporter'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
